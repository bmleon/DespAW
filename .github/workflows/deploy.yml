name: Deploy Frontend

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Docker/proyectos/web_ukiyo_nuxt

    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Git Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir imagen Docker
        run: |
          docker build -t bmleon/webcliente:${{ steps.vars.outputs.sha_short }} -t bmleon/webcliente:latest -f deploy/Dockerfile .

      - name: Subir imagen Docker Hub
        run: |
          docker push bmleon/webcliente:${{ steps.vars.outputs.sha_short }}
          docker push bmleon/webcliente:latest

      # Modificamos tu archivo real deploy-webcliente.yml respetando las comillas
      - name: Actualizar Kubernetes Deployment YAML
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # Reemplaza la imagen mutando el tag al nuevo SHA corto dentro de las comillas
          sed -i 's|image: "bmleon/webcliente:.*"|image: "bmleon/webcliente:${{ steps.vars.outputs.sha_short }}"|g' deploy/kubernetes/deploy-webcliente.yml
          
          # Volvemos a la raíz del repositorio para subir el archivo modificado a GitHub
          cd ../../../
          git add Docker/proyectos/web_ukiyo_nuxt/deploy/kubernetes/deploy-webcliente.yml
          git commit -m "chore(deploy): update frontend image tag to ${{ steps.vars.outputs.sha_short }} [skip ci]"
          git push origin master