name: Deploy Frontend

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Docker/proyectos/web_ukiyo_nuxt

    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir imagen Docker
        run: |
          docker build -t bmleon/webcliente:latest -f deploy/Dockerfile .

      - name: Subir imagen Docker Hub
        run: |
          docker push bmleon/webcliente:latest

      - name: Actualizar Kubernetes Deployment YAML
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          TIMESTAMP=$(date +'%d-%b-%Y_%H-%M')
          
          # Buscamos la línea FORCE_RESTART_FECHA en tu archivo deploy-webcliente.yml
          sed -i "s|name: FORCE_RESTART_FECHA.*|name: FORCE_RESTART_FECHA\n          value: \"$TIMESTAMP\"|g" deploy/kubernetes/deploy-webcliente.yml
          
          # Salimos a la raíz del repositorio completo para confirmar los cambios en Git
          cd ../../../
          git add Docker/proyectos/web_ukiyo_nuxt/deploy/kubernetes/deploy-webcliente.yml
          
          if ! git diff --cached --quiet; then
            git commit -m "chore(deploy): force frontend restart $TIMESTAMP [skip ci]"
            git push origin master
          else
            echo "No se detectaron cambios en el archivo deploy-webcliente.yml"
          fi