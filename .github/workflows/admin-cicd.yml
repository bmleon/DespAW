name: Deploy Admin Panel to Production

on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Docker/proyectos/Ukiyo_admin

    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Git Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir imagen Docker
        run: |
          docker build -t bmleon/ukiyo-admin:${{ steps.vars.outputs.sha_short }} -t bmleon/ukiyo-admin:latest -f deploy/Dockerfile .

      - name: Subir imagen Docker Hub
        run: |
          docker push bmleon/ukiyo-admin:${{ steps.vars.outputs.sha_short }}
          docker push bmleon/ukiyo-admin:latest

      # Modificamos tu archivo usando un buscador más flexible basado solo en la palabra clave 'ukiyo-admin'
      - name: Actualizar Kubernetes Deployment YAML
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # Buscador ultra-flexible: cambia cualquier cosa que contenga ukiyo-admin: dentro de comillas
          sed -i 's|image: ".*ukiyo-admin:.*"|image: "bmleon/ukiyo-admin:${{ steps.vars.outputs.sha_short }}"|g' deploy/kubernetes/deploy-admin.yml
          
          # Volvemos a la raíz del repositorio
          cd ../../../
          
          # Añadimos control de errores: Solo hace commit si hay cambios reales detectados por Git
          git add Docker/proyectos/Ukiyo_admin/deploy/kubernetes/deploy-admin.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore(deploy): update admin image tag to ${{ steps.vars.outputs.sha_short }} [skip ci]"
            git push origin master
          else
            echo "No se detectaron cambios en el archivo deploy-admin.yml"
          fi