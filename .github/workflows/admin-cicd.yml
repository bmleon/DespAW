name: Deploy Admin Panel to Production

on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Docker/proyectos/Ukiyo_admin

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir imagen Docker
        run: |
          docker build -t bmleon/ukiyo-admin:latest -f deploy/Dockerfile .

      - name: Subir imagen Docker Hub
        run: |
          docker push bmleon/ukiyo-admin:latest