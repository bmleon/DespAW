name: Deploy Admin Panel to Production

on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Docker/proyectos/Ukiyo_admin

    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir imagen Docker
        run: |
          docker build -t bmleon/ukiyo-admin:latest -f deploy/Dockerfile .

      - name: Subir imagen Docker Hub
        run: |
          docker push bmleon/ukiyo-admin:latest

      - name: Actualizar Kubernetes Deployment YAML
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # Generamos la marca de tiempo exacta del despliegue (ej: 01-Jun-2026_20-30)
          TIMESTAMP=$(date +'%d-%b-%Y_%H-%M')
          
          # Buscamos la línea FORCE_RESTART_FECHA e inyectamos el value con el timestamp actual
          sed -i 's|value: "[0-9]\{2\}-[a-zA-Z]\{4,5\}-[0-9]\{4\}-v[0-9]"|value: "'"$TIMESTAMP"'"|g' deploy/kubernetes/deploy-admin.yml
          # Por si el formato anterior guardado en Git fuera diferente, aseguramos el cambio:
          sed -i "s|name: FORCE_RESTART_FECHA.*|name: FORCE_RESTART_FECHA\n          value: \"$TIMESTAMP\"|g" deploy/kubernetes/deploy-admin.yml
          
          # Salimos a la raíz del repositorio completo para confirmar los cambios en Git
          cd ../../../
          git add Docker/proyectos/Ukiyo_admin/deploy/kubernetes/deploy-admin.yml
          
          if ! git diff --cached --quiet; then
            git commit -m "chore(deploy): force admin restart $TIMESTAMP [skip ci]"
            git push origin master
          else
            echo "No se detectaron cambios en el archivo deploy-admin.yml"
          fi