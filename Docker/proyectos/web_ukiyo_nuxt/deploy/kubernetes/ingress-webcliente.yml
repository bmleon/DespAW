apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-web-cliente
  namespace: web-cliente
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: public
  tls:
  - hosts:
    - tienda.ukiyocazorla.es
    - admin-ukiyo.ukiyocazorla.es
    secretName: ukiyo-tienda-tls
  rules:
  - host: tienda.ukiyocazorla.es
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: service-web-cliente
            port:
              number: 80
  - host: admin-ukiyo.ukiyocazorla.es
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: service-panel-admin
            port:
              number: 80